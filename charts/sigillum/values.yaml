## Common ##

image:
  repository: ghcr.io/se-wo/sigillum
  tag: ""           # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

commonLabels: {}
commonAnnotations: {}

logLevel: info

# Name of this cluster (US-4.5). When set, every audit record and log line
# carries a "cluster" field and the ServiceMonitor adds a "cluster" target
# label, so one log backend and one Prometheus can serve several clusters.
clusterName: ""

## CRDs ##
# CRDs ship in charts/sigillum/crds/ and Helm installs them automatically.
# Toggle deletion behaviour here (Helm removes nothing on uninstall by default,
# which is the safe operator pattern).

## api-server (REST send path) ##
api:
  enabled: true
  replicas: 2
  service:
    type: ClusterIP
    port: 8443
  metricsPort: 9090
  tokenAudience: sigillum
  tokenCacheSize: 4096
  tokenCacheTTL: 5m
  # On SIGTERM the pod first fails readiness for shutdownDelay while still
  # serving (so it leaves the Service endpoints before its listener closes),
  # then lets in-flight requests finish within shutdownTimeout. Keep
  # shutdownDelay + shutdownTimeout below terminationGracePeriodSeconds.
  shutdownDelay: 5s
  shutdownTimeout: 25s
  terminationGracePeriodSeconds: 35
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # TLS secret (optional). When unset, the api-server listens plain HTTP and
  # the chart user is expected to terminate TLS at the mesh / Gateway layer.
  tls:
    secretName: ""
  extraArgs: []

## SMTP proxy for legacy workloads (US-1.2) ##
# Disabled by default; REST-only deployments do not need it.
smtp:
  enabled: false
  replicas: 2
  service:
    type: ClusterIP
    port: 587
  # The container runs unprivileged and cannot bind < 1024; the Service maps
  # service.port onto this port.
  containerPort: 2587
  metricsPort: 9090
  domain: sigillum
  # oauthbearer: AUTH OAUTHBEARER with a projected ServiceAccount token
  #              (audience api.tokenAudience) — the recommended mode.
  # credential:  AUTH PLAIN / LOGIN with a Sigillum-issued MailCredential,
  #              for off-the-shelf apps that only take a username and
  #              password (see credentials below). Offered only after
  #              STARTTLS (tls.secretName) unless allowInsecureAuth is
  #              explicitly true.
  # podip:       legacy fallback identifying unauthenticated clients by pod
  #              IP. Grants the proxy cluster-wide pod list/watch, and still
  #              only matches policies with legacyAuth.podIPFallback: true.
  #              Requires that the proxy sees the caller's pod IP as source
  #              address (no SNAT/masquerading between caller and proxy).
  authModes: [oauthbearer]
  # Allow AUTH on connections without STARTTLS. Tokens then travel in clear
  # text inside the cluster. Unset (default), it follows tls.secretName:
  # false once STARTTLS is configured, true without it (for meshes with
  # mTLS). Set true or false to override. MailCredential passwords (mode
  # credential) are only accepted without TLS when this is explicitly true.
  allowInsecureAuth: null
  tls:
    secretName: ""    # enables STARTTLS with tls.crt / tls.key
  maxMessageBytes: 33554432
  maxRecipients: 100
  # Messages buffered and relayed at once per pod. Further messages wait up
  # to sendTimeout, then get a retryable 451. Memory budget per pod, to stay
  # below resources.limits.memory:
  #   maxConcurrentMessages x maxMessageBytes (4 x 32 MiB), a growing buffer
  #   may briefly hold up to twice that
  # + 2 x 64 MiB for argon2id checks of bring-your-own-hash MailCredentials
  #   (authModes credential; at most two run at once)
  # + about 64 MiB for the process and its informer caches.
  maxConcurrentMessages: 4
  sendTimeout: 60s
  shutdownDelay: 5s
  shutdownTimeout: 25s
  terminationGracePeriodSeconds: 35
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  extraArgs: []

## controller (reconcilers + validating webhook) ##
controller:
  enabled: true
  replicas: 1
  metricsPort: 8080
  probePort: 8081
  webhookPort: 9443
  leaderElect: true
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 256Mi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  extraArgs: []

## Sigillum-issued SMTP credentials (MailCredential, US-3.7) ##
# A MailCredential binds an SMTP username/password to one ServiceAccount in
# its namespace; enable smtp.authModes "credential" to accept them.
credentials:
  # Generated mode: the controller writes a random password into a Secret in
  # the credential's namespace and keeps only a hash. The chart grants the
  # controller Secret create/patch cluster-wide only together with a guard
  # ValidatingAdmissionPolicy that limits it to labelled credential Secrets. false = bring-your-own-hash only
  # (spec.passwordHash), and the controller gets no Secret write access.
  enabled: true
  # Namespaces that may not hold MailCredentials: exact names, or prefixes
  # ending in a single "*" ("*-system" is refused). The release namespace (which holds the relay credentials)
  # is always excluded. Add platform namespaces such as cert-manager or
  # istio-system as needed.
  excludeNamespaces:
    - "kube-*"
  # Host and port written into generated Secrets; default: the SMTP proxy
  # Service (<release>-smtp.<namespace>.svc:smtp.service.port).
  smtpHost: ""
  smtpPort: null

## Validating webhook ##
# The chart can either rely on cert-manager to provision the serving cert
# (recommended) or accept an externally-provided secret with tls.crt/tls.key.
webhook:
  enabled: true
  failurePolicy: Fail
  sideEffects: None
  certificate:
    # When useCertManager=true the chart creates an Issuer + Certificate that
    # writes into webhook.certificate.secretName.
    useCertManager: false
    issuerName: sigillum-selfsigned
    secretName: sigillum-webhook-tls
    duration: 8760h
    renewBefore: 720h

## Pod security ##
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop: [ALL]

## Rate limiting ##
# memory: per-replica counters — with api.replicas > 1 every replica enforces
#         the policy limit on its own, so the effective limit multiplies.
# redis:  one sliding window shared by all replicas (recommended for HA).
rateLimit:
  backend: memory
  # Only for backend=redis: admit mail while Redis is unreachable instead of
  # answering 503. Off by default (fail closed).
  failOpen: false
  redis:
    # One address = single node; several = Cluster, or Sentinel if
    # masterName is set.
    addrs: []
    masterName: ""
    db: 0
    tls: false
    # Secret holding the Redis password (and optionally ACL username).
    existingSecret: ""
    passwordKey: password
    usernameKey: ""

## Observability ##
# Audit stream (US-4.3): one JSON record per mail request, accepted or
# rejected, tagged "stream":"audit". Never contains subject/body/attachments.
# output: stdout | stderr | none. (A file path also works, but the root
# filesystem is read-only and the chart mounts no writable volume for it.)
audit:
  output: stdout

# OpenTelemetry tracing (US-4.4). OTLP over HTTP/protobuf; disabled while
# endpoint is empty. Spans: http.request > auth.tokenreview, policy.evaluate,
# ratelimit.allow, backend.send. Incoming W3C traceparent is continued.
tracing:
  endpoint: ""            # e.g. http://otel-collector.observability:4318
  sampler: ""             # OTEL_TRACES_SAMPLER, e.g. parentbased_traceidratio
  samplerArg: ""          # OTEL_TRACES_SAMPLER_ARG, e.g. "0.1"
  resourceAttributes: ""  # OTEL_RESOURCE_ATTRIBUTES, e.g. deployment.environment=prod

serviceMonitor:
  enabled: false
  namespace: ""
  labels: {}
  interval: 30s
  scrapeTimeout: 10s

## RBAC ##
# A ClusterRole that lets external service accounts hold view/edit/admin
# permissions on Sigillum CRs is rendered when rbac.aggregateClusterRoles=true.
rbac:
  create: true
  aggregateClusterRoles: true
  # allowedSecretNamespaces lists namespaces outside the release namespace from
  # which the api-server and controller are permitted to read Secrets. Required
  # for ClusterMailBackend credentials that live in a different namespace.
  # Each entry renders a Role + RoleBinding in that namespace.
  allowedSecretNamespaces: []
