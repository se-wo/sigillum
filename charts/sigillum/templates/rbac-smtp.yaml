{{- if and .Values.rbac.create .Values.smtp.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sigillum.smtp.fullname" . }}
  labels: {{- include "sigillum.smtp.labels" . | nindent 4 }}
rules:
  # Validate OAUTHBEARER tokens.
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [sigillum.dev]
    resources: [mailbackends, clustermailbackends, mailpolicies]
    verbs: [get, list, watch]
  {{- if has "credential" .Values.smtp.authModes }}
  # AUTH PLAIN / LOGIN: verify against MailCredential status hashes. The
  # proxy never reads the credential Secrets.
  - apiGroups: [sigillum.dev]
    resources: [mailcredentials]
    verbs: [get, list, watch]
  {{- end }}
  # Resolve caller ServiceAccount labels for serviceAccountSelector subjects.
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, list, watch]
  {{- if has "podip" .Values.smtp.authModes }}
  # Pod-IP legacy fallback: map source IP -> pod -> ServiceAccount.
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sigillum.smtp.fullname" . }}
  labels: {{- include "sigillum.smtp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sigillum.smtp.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sigillum.smtp.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- range (prepend .Values.rbac.allowedSecretNamespaces $.Release.Namespace) }}
---
# Backend credentials: same namespace scoping as the api-server.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sigillum.smtp.fullname" $ }}-secret-reader
  namespace: {{ . }}
  labels: {{- include "sigillum.smtp.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sigillum.smtp.fullname" $ }}-secret-reader
  namespace: {{ . }}
  labels: {{- include "sigillum.smtp.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sigillum.smtp.fullname" $ }}-secret-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "sigillum.smtp.fullname" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
