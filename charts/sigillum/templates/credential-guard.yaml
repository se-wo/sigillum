{{- if include "sigillum.credentials.guarded" . }}
{{- /*
Credential Secret guard (SPEC §4.10). The controller writes generated
MailCredential Secrets cluster-wide; this policy admits such writes only for
Secrets labelled sigillum.dev/credential, annotated with the owning
MailCredential's UID and controlled by it, outside the excluded namespaces
and the release namespace. The controller verifies this policy and binding
at startup and periodically, and writes no Secrets while they are missing or
changed. Keep in sync with internal/credential/guard.go (test/chart checks).
*/}}
{{- $exact := list }}
{{- $prefixes := list }}
{{- range .Values.credentials.excludeNamespaces }}
{{- if hasSuffix "*" . }}
{{- $prefixes = append $prefixes (trimSuffix "*" .) }}
{{- else }}
{{- $exact = append $exact . }}
{{- end }}
{{- end }}
{{- $username := printf "system:serviceaccount:%s:%s" .Release.Namespace (include "sigillum.controller.fullname" .) }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "sigillum.credentials.guardName" . }}
  labels: {{- include "sigillum.controller.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secrets]
  matchConditions:
    - name: controller-only
      expression: {{ printf "request.userInfo.username == %s" (toJson $username) | quote }}
  variables:
    - name: releaseNamespace
      expression: {{ toJson .Release.Namespace | quote }}
    - name: excludedNames
      expression: {{ toJson $exact | quote }}
    - name: excludedPrefixes
      expression: {{ toJson $prefixes | quote }}
    - name: credential
      expression: "has(object.metadata.labels) && 'sigillum.dev/credential' in object.metadata.labels ? object.metadata.labels['sigillum.dev/credential'] : ''"
    - name: uid
      expression: "has(object.metadata.annotations) && 'sigillum.dev/credential-uid' in object.metadata.annotations ? object.metadata.annotations['sigillum.dev/credential-uid'] : ''"
  validations:
    - expression: "variables.credential != '' && variables.uid != ''"
      message: the Sigillum controller may only write Secrets labelled sigillum.dev/credential and annotated sigillum.dev/credential-uid
    - expression: "has(object.metadata.ownerReferences) && object.metadata.ownerReferences.exists(r, r.apiVersion.startsWith('sigillum.dev/') && r.kind == 'MailCredential' && r.name == variables.credential && r.uid == variables.uid && has(r.controller) && r.controller)"
      message: the Secret must be controlled by the MailCredential named in its sigillum.dev/credential label
    - expression: "request.operation != 'UPDATE' || (has(oldObject.metadata.labels) && 'sigillum.dev/credential' in oldObject.metadata.labels && oldObject.metadata.labels['sigillum.dev/credential'] == variables.credential && has(oldObject.metadata.annotations) && 'sigillum.dev/credential-uid' in oldObject.metadata.annotations && oldObject.metadata.annotations['sigillum.dev/credential-uid'] == variables.uid)"
      message: the Sigillum controller may only update Secrets that already belong to the same MailCredential
    - expression: "request.namespace != variables.releaseNamespace && !(request.namespace in variables.excludedNames) && !variables.excludedPrefixes.exists(p, request.namespace.startsWith(p))"
      message: this namespace is excluded from generated mail credentials
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "sigillum.credentials.guardName" . }}
  labels: {{- include "sigillum.controller.labels" . | nindent 4 }}
spec:
  policyName: {{ include "sigillum.credentials.guardName" . }}
  validationActions: [Deny]
{{- end }}
