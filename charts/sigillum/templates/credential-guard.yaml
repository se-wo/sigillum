{{- if include "sigillum.credentials.guarded" . }}
{{- /*
Credential Secret guard (SPEC §4.10). The controller writes generated
MailCredential Secrets cluster-wide; this policy admits such writes only for
Secrets labelled sigillum.dev/credential, annotated with the owning
MailCredential's UID and controlled by it, of type Opaque with only the
credential keys, outside the excluded namespaces and the release namespace.
It also admits the OAuth token Secrets of delegated backends: labelled
sigillum.dev/oauth-token, annotated with the backend's UID and controlled by
it, Opaque, only the token keys, outside the excluded namespaces or in the
release namespace. The controller verifies this policy and binding
at startup and periodically, and writes no Secrets while they are missing or
changed. Keep in sync with internal/credential/guard.go (test/chart checks).
*/}}
{{- $exact := list }}
{{- $prefixes := list }}
{{- /* Trimmed and without empty entries, like the controller's --credential-exclude-namespaces. */}}
{{- range .Values.credentials.excludeNamespaces }}
{{- $ns := trim . }}
{{- if hasSuffix "*" $ns }}
{{- $prefixes = append $prefixes (trimSuffix "*" $ns) }}
{{- else if $ns }}
{{- $exact = append $exact $ns }}
{{- end }}
{{- end }}
{{- $username := printf "system:serviceaccount:%s:%s" .Release.Namespace (include "sigillum.controller.fullname" .) }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "sigillum.credentials.guardName" . }}
  labels: {{- include "sigillum.controller.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secrets]
  matchConditions:
    - name: controller-only
      expression: {{ printf "request.userInfo.username == %s" (toJson $username) | quote }}
  variables:
    - name: releaseNamespace
      expression: {{ toJson .Release.Namespace | quote }}
    - name: excludedNames
      expression: {{ toJson $exact | quote }}
    - name: excludedPrefixes
      expression: {{ toJson $prefixes | quote }}
    - name: credential
      expression: "has(object.metadata.labels) && 'sigillum.dev/credential' in object.metadata.labels ? object.metadata.labels['sigillum.dev/credential'] : ''"
    - name: uid
      expression: "has(object.metadata.annotations) && 'sigillum.dev/credential-uid' in object.metadata.annotations ? object.metadata.annotations['sigillum.dev/credential-uid'] : ''"
    - name: oauthBackend
      expression: "has(object.metadata.labels) && 'sigillum.dev/oauth-token' in object.metadata.labels ? object.metadata.labels['sigillum.dev/oauth-token'] : ''"
    - name: oauthUID
      expression: "has(object.metadata.annotations) && 'sigillum.dev/oauth-token-uid' in object.metadata.annotations ? object.metadata.annotations['sigillum.dev/oauth-token-uid'] : ''"
    - name: isCredential
      expression: "variables.credential != '' && variables.uid != '' && variables.oauthBackend == '' && variables.oauthUID == ''"
    - name: isOAuth
      expression: "variables.oauthBackend != '' && variables.oauthUID != '' && variables.credential == '' && variables.uid == ''"
  validations:
    - expression: "variables.isCredential || variables.isOAuth"
      message: the Sigillum controller may only write Secrets labelled sigillum.dev/credential and annotated sigillum.dev/credential-uid, or labelled sigillum.dev/oauth-token and annotated sigillum.dev/oauth-token-uid
    - expression: "has(object.metadata.ownerReferences) && object.metadata.ownerReferences.exists(r, r.apiVersion.startsWith('sigillum.dev/') && has(r.controller) && r.controller && (variables.isCredential ? r.kind == 'MailCredential' && r.name == variables.credential && r.uid == variables.uid : (r.kind == 'MailBackend' || r.kind == 'ClusterMailBackend') && r.name == variables.oauthBackend && r.uid == variables.oauthUID))"
      message: the Secret must be controlled by the MailCredential named in its sigillum.dev/credential label, or by the backend named in its sigillum.dev/oauth-token label
    - expression: "request.operation != 'UPDATE' || (variables.isCredential ? (has(oldObject.metadata.labels) && 'sigillum.dev/credential' in oldObject.metadata.labels && oldObject.metadata.labels['sigillum.dev/credential'] == variables.credential && has(oldObject.metadata.annotations) && 'sigillum.dev/credential-uid' in oldObject.metadata.annotations && oldObject.metadata.annotations['sigillum.dev/credential-uid'] == variables.uid) : (has(oldObject.metadata.labels) && 'sigillum.dev/oauth-token' in oldObject.metadata.labels && oldObject.metadata.labels['sigillum.dev/oauth-token'] == variables.oauthBackend && has(oldObject.metadata.annotations) && 'sigillum.dev/oauth-token-uid' in oldObject.metadata.annotations && oldObject.metadata.annotations['sigillum.dev/oauth-token-uid'] == variables.oauthUID))"
      message: the Sigillum controller may only update Secrets that already belong to the same MailCredential or backend
    - expression: "has(object.type) && object.type == 'Opaque'"
      message: the Sigillum controller may only write Secrets of type Opaque
    - expression: "!has(object.data) || object.data.all(k, variables.isCredential ? k in ['username', 'password', 'host', 'port'] : k in ['refresh_token', 'access_token', 'expires_at'])"
      message: the Sigillum controller may only write the keys username, password, host and port (credential Secrets) or refresh_token, access_token and expires_at (OAuth token Secrets)
    - expression: "variables.isOAuth && request.namespace == variables.releaseNamespace || request.namespace != variables.releaseNamespace && !(request.namespace in variables.excludedNames) && !variables.excludedPrefixes.exists(p, request.namespace.startsWith(p))"
      message: this namespace is excluded from generated mail credentials
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "sigillum.credentials.guardName" . }}
  labels: {{- include "sigillum.controller.labels" . | nindent 4 }}
spec:
  policyName: {{ include "sigillum.credentials.guardName" . }}
  validationActions: [Deny]
{{- end }}
