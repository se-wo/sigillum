{{- if and .Values.controller.enabled .Values.webhook.enabled }}
{{- /*
Without cert-manager the controller serves the webhook with an existing
Secret, and the API server must trust its issuer: caBundle comes from
webhook.certificate.caBundle, else the Secret's ca.crt, else the caBundle
already on this object (set by hand or another injector). A webhook without
either (failurePolicy Fail) would block every Sigillum resource, so the
install fails instead.

lookup returns nothing without a cluster connection (helm template, client-
side dry run): the list of Secrets in the release namespace is only empty
then, so it tells the two cases apart. A lookup Helm is not allowed to make
aborts the render, so only reads Helm's own work needs are made: Secrets in
the release namespace (its release storage) and this object.
*/}}
{{- $cert := .Values.webhook.certificate }}
{{- $caBundle := "" }}
{{- if not $cert.useCertManager }}
{{- $caBundle = $cert.caBundle | default "" }}
{{- $secretName := include "sigillum.webhook.secretName" . }}
{{- if lookup "v1" "Secret" .Release.Namespace "" }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if not $secret }}
{{- fail (printf "the admission webhook (webhook.enabled=true) needs a serving certificate, but webhook.certificate.useCertManager=false and Secret %s/%s does not exist. Install cert-manager and set webhook.certificate.useCertManager=true, or create the Secret (tls.crt, tls.key, and ca.crt or webhook.certificate.caBundle) first, or set webhook.enabled=false" .Release.Namespace $secretName) }}
{{- end }}
{{- if not $caBundle }}
{{- $caBundle = dig "data" "ca.crt" "" $secret }}
{{- end }}
{{- if not $caBundle }}
{{- $live := lookup "admissionregistration.k8s.io/v1" "ValidatingWebhookConfiguration" "" (include "sigillum.fullname" .) }}
{{- range (dig "webhooks" (list) $live) }}
{{- if not $caBundle }}
{{- $caBundle = dig "clientConfig" "caBundle" "" . }}
{{- end }}
{{- end }}
{{- end }}
{{- if not $caBundle }}
{{- fail (printf "the API server cannot trust the admission webhook: webhook.certificate.useCertManager=false, webhook.certificate.caBundle is empty and Secret %s/%s has no ca.crt. Set webhook.certificate.caBundle to the base64-encoded PEM of the CA that issued tls.crt (for a self-signed certificate, tls.crt itself), or set webhook.enabled=false" .Release.Namespace $secretName) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "sigillum.fullname" . }}
  labels: {{- include "sigillum.labels" . | nindent 4 }}
  {{- if .Values.webhook.certificate.useCertManager }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "sigillum.fullname" . }}-webhook
  {{- end }}
webhooks:
  - name: vmailbackend.sigillum.dev
    admissionReviewVersions: [v1]
    sideEffects: {{ .Values.webhook.sideEffects }}
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      {{- with $caBundle }}
      caBundle: {{ . }}
      {{- end }}
      service:
        name: {{ include "sigillum.webhook.serviceName" . }}
        namespace: {{ .Release.Namespace }}
        path: /validate-sigillum-dev-v1alpha1-mailbackend
        port: 443
    rules:
      - apiGroups: [sigillum.dev]
        apiVersions: [v1alpha1]
        resources: [mailbackends]
        operations: [CREATE, UPDATE]
        scope: Namespaced
  - name: vclustermailbackend.sigillum.dev
    admissionReviewVersions: [v1]
    sideEffects: {{ .Values.webhook.sideEffects }}
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      {{- with $caBundle }}
      caBundle: {{ . }}
      {{- end }}
      service:
        name: {{ include "sigillum.webhook.serviceName" . }}
        namespace: {{ .Release.Namespace }}
        path: /validate-sigillum-dev-v1alpha1-clustermailbackend
        port: 443
    rules:
      - apiGroups: [sigillum.dev]
        apiVersions: [v1alpha1]
        resources: [clustermailbackends]
        operations: [CREATE, UPDATE]
        scope: Cluster
  - name: vmailpolicy.sigillum.dev
    admissionReviewVersions: [v1]
    sideEffects: {{ .Values.webhook.sideEffects }}
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      {{- with $caBundle }}
      caBundle: {{ . }}
      {{- end }}
      service:
        name: {{ include "sigillum.webhook.serviceName" . }}
        namespace: {{ .Release.Namespace }}
        path: /validate-sigillum-dev-v1alpha1-mailpolicy
        port: 443
    rules:
      - apiGroups: [sigillum.dev]
        apiVersions: [v1alpha1]
        resources: [mailpolicies]
        operations: [CREATE, UPDATE]
        scope: Namespaced
  - name: vmailcredential.sigillum.dev
    admissionReviewVersions: [v1]
    sideEffects: {{ .Values.webhook.sideEffects }}
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      {{- with $caBundle }}
      caBundle: {{ . }}
      {{- end }}
      service:
        name: {{ include "sigillum.webhook.serviceName" . }}
        namespace: {{ .Release.Namespace }}
        path: /validate-sigillum-dev-v1alpha1-mailcredential
        port: 443
    rules:
      - apiGroups: [sigillum.dev]
        apiVersions: [v1alpha1]
        resources: [mailcredentials]
        operations: [CREATE, UPDATE]
        scope: Namespaced
{{- end }}
