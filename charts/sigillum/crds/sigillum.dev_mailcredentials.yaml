---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: mailcredentials.sigillum.dev
spec:
  group: sigillum.dev
  names:
    categories:
    - sigillum
    kind: MailCredential
    listKind: MailCredentialList
    plural: mailcredentials
    shortNames:
    - mc
    singular: mailcredential
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.serviceAccountName
      name: ServiceAccount
      type: string
    - jsonPath: .status.username
      name: Username
      type: string
    - jsonPath: .spec.secretName
      name: Secret
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          MailCredential is a Sigillum-issued SMTP username and password bound to
          one ServiceAccount in its namespace, for SMTP clients that only support
          AUTH PLAIN or LOGIN (US-3.7).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              MailCredentialSpec is the desired state of MailCredential.

              Exactly one mode applies:
                - generated (secretName set): the controller generates a 256-bit random
                  password, writes it to the Secret and keeps only a hash in status;
                - bring your own hash (passwordHash set): the user supplies an argon2id
                  hash and delivers the Secret themselves.
            properties:
              passwordHash:
                description: |-
                  PasswordHash is an argon2id hash in PHC string format
                  ($argon2id$v=19$m=...,t=...,p=...$salt$hash), for bring-your-own-hash
                  mode. Mutually exclusive with secretName and rotation.
                type: string
              rotation:
                description: Rotation configures rotation of the generated password.
                properties:
                  gracePeriod:
                    default: 24h
                    description: |-
                      GracePeriod keeps the previous password valid after a rotation, so
                      apps can pick up the new one. A Go duration or a number of days.
                    type: string
                  interval:
                    description: |-
                      Interval rotates the password periodically. A Go duration or a number
                      of days such as "90d". Unset: rotate only on demand (annotation
                      sigillum.dev/rotate).
                    type: string
                type: object
              secretName:
                description: |-
                  SecretName is the Secret the controller creates and owns (generated
                  mode). Mutually exclusive with passwordHash.
                type: string
              serviceAccountName:
                description: |-
                  ServiceAccountName is the identity the credential authenticates as,
                  in the credential's own namespace.
                minLength: 1
                type: string
            required:
            - serviceAccountName
            type: object
          status:
            description: MailCredentialStatus is the observed state of MailCredential.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              current:
                description: Current is the hash of the password in the Secret (generated
                  mode).
                properties:
                  createdAt:
                    format: date-time
                    type: string
                  hash:
                    description: Hash is "sha256:<hex>" of the password; never the
                      plaintext.
                    type: string
                required:
                - createdAt
                - hash
                type: object
              lastRotateRequest:
                description: |-
                  LastRotateRequest is the last value of the sigillum.dev/rotate
                  annotation that was acted upon.
                type: string
              observedGeneration:
                format: int64
                type: integer
              previous:
                description: Previous is present only during a rotation's grace period.
                properties:
                  hash:
                    type: string
                  validUntil:
                    format: date-time
                    type: string
                required:
                - hash
                - validUntil
                type: object
              secretName:
                description: |-
                  SecretName is the Secret that holds the current password (generated
                  mode).
                type: string
              username:
                description: Username is the SMTP username, "<name>.<namespace>".
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
