# Microsoft 365 via SMTP AUTH with a mailbox password (client submission).
#
# Stopgap only. Microsoft is retiring Basic authentication for SMTP AUTH
# (Exchange Online timeline of January 2026): it is disabled by default for
# existing tenants at the end of December 2026 (admins can still re-enable
# it), new tenants no longer get it, and the final removal date is to be
# announced in the second half of 2027. Sigillum's OAuth support for the SMTP
# driver (authType XOAUTH2) is planned for v0.5.0. Until then, prefer one of:
#   microsoft-365-connector.yaml          relay connector, no password
#   azure-communication-services.yaml     Entra app client secret
#   microsoft-365-hve.yaml                High Volume Email, internal recipients
#
# Requirements: SMTP AUTH enabled for the tenant and the mailbox
# (Set-CASMailbox <mailbox> -SmtpClientAuthenticationDisabled $false), no
# Security Defaults / Conditional Access blocking legacy auth, and every
# sender is the mailbox itself or one it may send as. Limit: 10,000
# recipients per day and mailbox.
apiVersion: v1
kind: Secret
metadata:
  name: microsoft-365-smtp
  namespace: sigillum-system
type: Opaque
stringData:
  username: "noreply@example.com"
  password: "REPLACE-ME"   # set out of band; do not commit
---
apiVersion: sigillum.dev/v1alpha1
kind: ClusterMailBackend
metadata:
  name: microsoft-365
spec:
  type: smtp
  smtp:
    endpoints:
      - host: smtp.office365.com
        port: 587
        tls: starttls
    authType: LOGIN
    credentialsRef:
      name: microsoft-365-smtp
      namespace: sigillum-system
    connectionTimeoutSeconds: 10
  healthCheck:
    intervalSeconds: 300
