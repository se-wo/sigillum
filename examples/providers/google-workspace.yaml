# Google Workspace SMTP relay service (smtp-relay.gmail.com). Configure it in
# the Admin console: Apps > Google Workspace > Gmail > Routing > SMTP relay
# service. Two ways to authenticate; pick one backend.
#
# "Less secure apps" are gone for all Workspace accounts, and smtp.gmail.com
# rejects plain account passwords. Password logins only work with an app
# password, which needs 2-Step Verification on the account and app
# passwords not being disabled by the Workspace admin. App passwords still
# work (no cut-off announced), but they belong to one user and are revoked
# when that user changes their password. A Gmail API driver with a service
# account (domain-wide delegation) is planned for v0.4.0.
#
# 1. SMTP authentication with an app password ("Require SMTP
#    Authentication" in the relay setting).
apiVersion: v1
kind: Secret
metadata:
  name: google-workspace-smtp
  namespace: sigillum-system
type: Opaque
stringData:
  username: "noreply@example.com"   # a Workspace user with 2-Step Verification
  password: "REPLACE-ME"            # its app password; set out of band
---
apiVersion: sigillum.dev/v1alpha1
kind: ClusterMailBackend
metadata:
  name: google-workspace
spec:
  type: smtp
  smtp:
    endpoints:
      - host: smtp-relay.gmail.com
        port: 587
        tls: starttls
    authType: PLAIN
    credentialsRef:
      name: google-workspace-smtp
      namespace: sigillum-system
    connectionTimeoutSeconds: 10
  healthCheck:
    intervalSeconds: 300
---
# 2. No password: the relay accepts mail from the cluster's static egress
#    IP ("Only accept mail from the specified IP addresses" in the relay
#    setting). Needs a static egress IP for the Sigillum pods.
apiVersion: sigillum.dev/v1alpha1
kind: ClusterMailBackend
metadata:
  name: google-workspace-ip
spec:
  type: smtp
  smtp:
    endpoints:
      - host: smtp-relay.gmail.com
        port: 587
        tls: starttls
    authType: NONE
    connectionTimeoutSeconds: 10
  healthCheck:
    intervalSeconds: 300
