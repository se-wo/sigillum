# Personal Outlook.com account via SMTP with OAuth (XOAUTH2; SPEC US-6.1
# stage 2, US-6.3).
#
# Personal Microsoft accounts have no password login and no app passwords
# any more. A person signs in once; Sigillum's controller then keeps an
# access token fresh with the refresh token of that sign-in and sends
# through smtp-mail.outlook.com with it.
#
# 1. Register an application (https://entra.microsoft.com > App
#    registrations > New registration). Registering needs a Microsoft Entra
#    tenant; with only an Outlook.com account, sign up for a free Azure
#    account first, which creates one.
#      - Supported account types: "Personal Microsoft accounts only" (or
#        "... and personal Microsoft accounts").
#      - Authentication > Allow public client flows: Yes.
#      - API permissions > Add > Microsoft Graph > Delegated: openid,
#        profile, email, offline_access and SMTP.Send.
#    Note the Application (client) ID. No client secret is needed.
#
# 2. Apply the ClusterMailBackend below with your client ID and address.
#    The chart's credentials.enabled (default true) must stay on: it
#    installs the Secret guard under which the controller may write the
#    token Secret. The Secret named in credentialsRef does not have to
#    exist; its namespace is where the controller keeps the tokens.
#
# 3. Sign in once. The controller starts a device code sign-in and shows
#    where to go:
#
#      kubectl describe cmb outlook-com
#      #  Authorized  False  AuthorizationPending  to sign in as me@outlook.com,
#      #  open https://www.microsoft.com/link and enter the code ABCD1234 ...
#
#    Open the link on any device, enter the code, sign in as the mailbox and
#    consent. Within a few seconds Authorized turns True and the backend
#    Ready. Only a sign-in of oauth.mailbox is accepted: anyone who can read
#    the backend sees the code, and another account's sign-in is refused.
#
# The code is valid for 15 minutes. When it expired, was declined, or the
# provider later rejects the refresh token (consent revoked), the condition
# says so; ask for a new sign-in by setting any new value:
#
#      kubectl annotate --overwrite cmb outlook-com sigillum.dev/authorize="$(date +%s)"
#
# The same starts a new sign-in while the backend works (to switch the
# account); it keeps sending with the old one until the new one is done.
# The metric sigillum_backend_authorized is 0 while no sign-in works.
#
# A refresh token obtained elsewhere (sigillum oauth login, later) can be put
# into the credentials Secret under the key refresh_token instead; a new
# value there replaces the stored sign-in. The refresh token grants
# sending as you: Microsoft rotates it on every use, and the controller
# keeps the current one in the Secret sigillum-oauth-cmb-outlook-com.
#
# Without allowedSenders the backend sends only as oauth.mailbox. Personal
# accounts have far lower daily sending limits than business mailboxes:
# set the policy's rateLimits.messagesPerDay well below Microsoft's limit.
apiVersion: sigillum.dev/v1alpha1
kind: ClusterMailBackend
metadata:
  name: outlook-com
spec:
  type: smtp
  smtp:
    endpoints:
      - host: smtp-mail.outlook.com
        port: 587
        tls: starttls
    authType: XOAUTH2
    credentialsRef:
      name: outlook-com-signin   # optional Secret; its namespace holds the tokens
      namespace: sigillum-system
    oauth:
      provider: microsoft
      tenant: consumers
      clientID: "00000000-0000-0000-0000-000000000000"   # Application (client) ID
      mailbox: me@outlook.com
