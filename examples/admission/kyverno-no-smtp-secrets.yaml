# Workloads must not carry their own SMTP credentials (US-5.7): refuse
# Secrets whose name or keys look like SMTP credentials outside the Sigillum
# release namespace. Secrets for a MailCredential are exempt only when the
# Sigillum controller writes them: a workload could put the
# sigillum.dev/credential label on its own Secret, so the label alone
# proves nothing. Exempting a requester needs admission request data, so
# background scans are off; start with Audit to see what gets created.
# Adjust the ServiceAccount to your release (<release>-controller, or
# sigillum-controller for a release named sigillum).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sigillum-no-workload-smtp-secrets
  annotations:
    policies.kyverno.io/title: No workload SMTP credentials
    policies.kyverno.io/description: >-
      Mail leaves the cluster through Sigillum. Relay passwords belong in
      the Sigillum namespace; apps use tokens or a MailCredential.
spec:
  validationFailureAction: Audit
  background: false
  rules:
    - name: no-smtp-secrets
      match:
        any:
          - resources:
              kinds: [Secret]
      exclude:
        any:
          - resources:
              namespaces: [sigillum-system]
          - subjects:
              - kind: ServiceAccount
                name: sigillum-controller
                namespace: sigillum-system
      validate:
        cel:
          expressions:
            - expression: >-
                !(object.metadata.name.lowerAscii().contains('smtp') ||
                  (has(object.data) && object.data.exists(k, k.lowerAscii().startsWith('smtp'))))
              message: >-
                Secrets that look like SMTP credentials are not allowed in workload namespaces.
                Send through Sigillum (REST with a ServiceAccount token, or SMTP with a MailCredential).
