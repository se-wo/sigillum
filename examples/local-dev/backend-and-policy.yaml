# Mailpit as a cluster-wide backend: no auth, no TLS (US-7.1).
apiVersion: sigillum.dev/v1alpha1
kind: ClusterMailBackend
metadata:
  name: mailpit
spec:
  type: smtp
  smtp:
    endpoints:
      - host: mailpit.mailpit.svc.cluster.local
        port: 1025
        tls: none
    authType: NONE
  healthCheck:
    intervalSeconds: 30
---
# Permissive policy: every ServiceAccount labelled for mail in namespace
# "dev" may send as anyone to anyone, 60 messages per minute.
apiVersion: sigillum.dev/v1alpha1
kind: MailPolicy
metadata:
  name: dev-permissive
  namespace: dev
spec:
  subjects:
    - serviceAccount: { name: my-app }
    - serviceAccountSelector:
        matchLabels: { sigillum.dev/mail: "true" }
  backendRef:
    name: mailpit
    kind: ClusterMailBackend
  rateLimits:
    messagesPerMinute: 60
---
# SMTP username/password for apps that cannot use tokens (US-3.7). The
# controller writes the password to Secret "my-app-smtp".
apiVersion: sigillum.dev/v1alpha1
kind: MailCredential
metadata:
  name: my-app
  namespace: dev
spec:
  serviceAccountName: my-app
  secretName: my-app-smtp
