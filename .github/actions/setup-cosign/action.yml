name: setup-cosign
description: >
  Installs a pinned cosign release binary and verifies it against a pinned
  SHA-256 before putting it on PATH. Used instead of a third-party installer
  action, which the repository's Actions policy does not allow.

  To bump: update both values from the release's cosign_checksums.txt
  (https://github.com/sigstore/cosign/releases). Dependabot cannot see these.

inputs:
  version:
    description: cosign release tag
    default: v3.1.3
  sha256:
    description: SHA-256 of cosign-linux-amd64 for that release
    default: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71

runs:
  using: composite
  steps:
    - name: install cosign
      shell: bash
      env:
        COSIGN_VERSION: ${{ inputs.version }}
        COSIGN_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/cosign-bin"
        mkdir -p "$dir"
        curl -sSfL --retry 3 -o "$dir/cosign" \
          "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
        echo "${COSIGN_SHA256}  $dir/cosign" | sha256sum -c -
        chmod +x "$dir/cosign"
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/cosign" version
