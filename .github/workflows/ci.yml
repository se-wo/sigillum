name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only read the repository unless they say otherwise.
permissions:
  contents: read

# Actions are pinned to commit SHAs (not tags). Tag comments track which
# human-readable release the SHA corresponds to. Dependabot bumps them.
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: vet
        run: go vet ./...
      - name: build
        run: make build
      - name: test
        run: make test
      - name: upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sigillum-linux-amd64
          path: bin/sigillum
          retention-days: 1
          if-no-files-found: error

  # Reports known vulnerabilities (golang.org/x/vuln) in the Go toolchain
  # and modules that the code actually reaches.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: make vulncheck

  # Blocks PRs that add dependencies with known vulnerabilities (moderate or
  # worse) from the GitHub Advisory Database.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  e2e:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sigillum-linux-amd64
          path: bin/
      - name: make binary executable
        run: chmod +x bin/sigillum
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          version: v0.23.0
          cluster_name: kind
      - name: build image
        run: docker build -f Dockerfile.ci -t ghcr.io/se-wo/sigillum:ci .
      - name: load image
        run: kind load docker-image ghcr.io/se-wo/sigillum:ci
      - name: e2e
        env:
          SIGILLUM_E2E: "1"
        run: make e2e
      - name: diagnostics on failure
        if: failure()
        run: |
          set +e
          echo "::group::nodes"
          kubectl get nodes -o wide
          echo "::endgroup::"
          for ns in sigillum-e2e mailhog cert-manager; do
            if kubectl get ns "$ns" >/dev/null 2>&1; then
              echo "::group::[$ns] pods"
              kubectl -n "$ns" get pods -o wide
              echo "::endgroup::"
              echo "::group::[$ns] describe pods"
              kubectl -n "$ns" describe pods
              echo "::endgroup::"
              echo "::group::[$ns] events"
              kubectl -n "$ns" get events --sort-by=.lastTimestamp
              echo "::endgroup::"
              echo "::group::[$ns] logs (current + previous)"
              for pod in $(kubectl -n "$ns" get pods -o name); do
                for c in $(kubectl -n "$ns" get "$pod" -o jsonpath='{.spec.containers[*].name}'); do
                  echo "--- $pod ($c) current ---"
                  kubectl -n "$ns" logs "$pod" -c "$c" --tail=300
                  echo "--- $pod ($c) previous ---"
                  kubectl -n "$ns" logs "$pod" -c "$c" --tail=300 --previous 2>/dev/null
                done
              done
              echo "::endgroup::"
            fi
          done
          echo "::group::sigillum CRs"
          kubectl get clustermailbackends,mailbackends,mailpolicies -A -o yaml 2>/dev/null
          echo "::endgroup::"
          echo "::group::helm release"
          helm -n sigillum-e2e list
          helm -n sigillum-e2e status sigillum 2>/dev/null
          echo "::endgroup::"
