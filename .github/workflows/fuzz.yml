name: fuzz

# Continuous fuzzing with Go's native fuzzer (func FuzzXxx(f *testing.F),
# listed by hack/fuzz.sh). This is the Go fuzzing that the OpenSSF Scorecard
# "Fuzzing" check recognises. Every plain `go test` (so also build-test) replays
# the seed corpus and any committed failing inputs; this workflow searches for
# new ones:
#
#   - pull requests that touch Go code: a short run per target
#   - daily on main: a longer run, building on the corpus of earlier runs
#   - manually, with a chosen duration
#
# The generated corpus is kept in the Actions cache per package, so each run
# starts where the previous one stopped. A failing input is uploaded as an
# artifact; reproduce it with `go test -run '<FuzzName>/<file>' ./<package>`
# after copying it into <package>/testdata/fuzz/<FuzzName>/.
#
# ClusterFuzzLite and OSS-Fuzz would need third-party actions, which the
# repository's Actions policy does not allow (CONTRIBUTING.md), so only
# GitHub-owned actions are used here. Actions are pinned to commit SHAs;
# tag comments track the release. Dependabot bumps them.
on:
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'hack/fuzz.sh'
      - '.github/workflows/fuzz.yml'
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'hack/fuzz.sh'
      - '.github/workflows/fuzz.yml'
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per fuzz target (Go duration, e.g. 30m)
        required: true
        default: 10m

permissions:
  contents: read

# A new push to a PR supersedes its running fuzz jobs; main and the daily run
# are never cancelled.
concurrency:
  group: fuzz-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        name: list packages with fuzz targets
        run: |
          hack/fuzz.sh list
          echo "packages=$(hack/fuzz.sh list | cut -d' ' -f1 | sort -u | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz (${{ matrix.package }})
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.targets.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - id: env
        name: locate fuzz cache
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
          echo "key=fuzz-corpus-${PACKAGE//\//-}" >> "$GITHUB_OUTPUT"
      - name: restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.env.outputs.dir }}
          key: ${{ steps.env.outputs.key }}-${{ github.run_id }}
          restore-keys: ${{ steps.env.outputs.key }}-
      - name: fuzz
        env:
          PACKAGE: ${{ matrix.package }}
          # 30s per target on PRs and pushes, 10m daily, or the chosen time.
          FUZZTIME: ${{ inputs.fuzztime || (github.event_name == 'schedule' && '10m') || '30s' }}
        run: hack/fuzz.sh run "$FUZZTIME" "$PACKAGE"
      # Saved even when a target failed, so the corpus that led there is kept.
      - name: save corpus
        if: always() && steps.env.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.env.outputs.dir }}
          key: ${{ steps.env.outputs.key }}-${{ github.run_id }}
      - id: artifact
        name: name failing inputs artifact
        if: failure()
        env:
          PACKAGE: ${{ matrix.package }}
        run: echo "name=fuzz-failures-${PACKAGE//\//-}" >> "$GITHUB_OUTPUT"
      - name: upload failing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ matrix.package }}/testdata/fuzz/
          if-no-files-found: ignore
