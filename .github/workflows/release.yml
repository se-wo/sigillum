name: release

# Only GitHub-owned actions are used: the repository's Actions policy allows
# actions owned by se-wo, created by GitHub, or helm/kind-action. Docker
# buildx and Helm are preinstalled on ubuntu-latest and driven from shell.
# Actions are pinned to commit SHAs (not tags); tag comments track which
# human-readable release the SHA corresponds to. Bump deliberately.
#
# Pull requests that touch the release inputs run the same build without
# pushing, so a broken release is caught before a tag is cut.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Dockerfile
      - charts/**

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64
  PUBLISH: ${{ github.event_name == 'push' }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: compute version and tags
        id: meta
        run: |
          if [ "$PUBLISH" = true ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(awk '/^version:/ {print $2}' charts/sigillum/Chart.yaml)-dryrun"
          fi
          tags="$IMAGE:$version"
          # Stable releases also move the major.minor and latest tags;
          # pre-releases (x.y.z-rc.1) only get their exact tag.
          if [[ "$version" != *-* ]]; then
            tags="$tags,$IMAGE:${version%.*},$IMAGE:latest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "version=$version tags=$tags"

      - name: set up buildx
        run: |
          docker buildx version
          docker buildx create --name sigillum --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: log in to ghcr.io
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: build (and push on tags)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
          CREATED: ${{ steps.meta.outputs.created }}
        run: |
          args=(--platform "$PLATFORMS"
                --build-arg "VERSION=$VERSION"
                --build-arg "COMMIT=$GITHUB_SHA"
                --build-arg "DATE=$CREATED"
                --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
                --label "org.opencontainers.image.revision=$GITHUB_SHA"
                --label "org.opencontainers.image.version=$VERSION"
                --label "org.opencontainers.image.created=$CREATED"
                --provenance=false)
          IFS=, read -ra tag_list <<< "$TAGS"
          for t in "${tag_list[@]}"; do args+=(--tag "$t"); done
          if [ "$PUBLISH" = true ]; then args+=(--push); fi
          docker buildx build "${args[@]}" .

  chart:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: extract version
        id: v
        run: |
          if [ "$PUBLISH" = true ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(awk '/^version:/ {print $2}' charts/sigillum/Chart.yaml)" >> "$GITHUB_OUTPUT"
          fi

      - name: sanity-check chart version
        if: env.PUBLISH == 'true'
        env:
          WANT: ${{ steps.v.outputs.version }}
        run: |
          got=$(awk '/^version:/ {print $2}' charts/sigillum/Chart.yaml)
          if [ "$got" != "$WANT" ]; then
            echo "chart version $got != tag version $WANT"
            exit 1
          fi

      - name: lint and package chart
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          helm version
          helm lint charts/sigillum
          helm package charts/sigillum --version "$VERSION" --app-version "$VERSION"

      - name: push chart to OCI registry
        if: env.PUBLISH == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "sigillum-$VERSION.tgz" "oci://ghcr.io/$GITHUB_REPOSITORY_OWNER/charts"
