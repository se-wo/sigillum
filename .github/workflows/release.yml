name: release

# Only GitHub-owned actions are used: the repository's Actions policy allows
# actions owned by se-wo, created by GitHub, or helm/kind-action. Docker
# buildx and Helm are preinstalled on ubuntu-latest and driven from shell;
# cosign is a checksum-pinned release binary (.github/actions/setup-cosign).
# Actions are pinned to commit SHAs (not tags); tag comments track which
# human-readable release the SHA corresponds to. Dependabot bumps them.
#
# Supply chain: every published image and chart is
#   - signed keyless with cosign (Sigstore, GitHub OIDC identity), and
#   - given a SLSA build provenance attestation via actions/attest, stored in
#     GitHub and pushed to the registry next to the artifact.
# The image also carries BuildKit's SPDX SBOM and max-mode provenance per
# platform; the SBOMs are exported as a workflow artifact too. See the
# README's "Supply chain" section for the verify commands.
#
# Pull requests that touch the release inputs run the same build without
# pushing, so a broken release is caught before a tag is cut.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/actions/**
      - Dockerfile
      - charts/**

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64
  PUBLISH: ${{ github.event_name == 'push' }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write      # Sigstore signing certificate (cosign, attest)
      attestations: write  # store the provenance attestation in GitHub
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: compute version and tags
        id: meta
        run: |
          if [ "$PUBLISH" = true ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(awk '/^version:/ {print $2}' charts/sigillum/Chart.yaml)-dryrun"
          fi
          tags="$IMAGE:$version"
          # Stable releases also move the major.minor and latest tags;
          # pre-releases (x.y.z-rc.1) only get their exact tag.
          if [[ "$version" != *-* ]]; then
            tags="$tags,$IMAGE:${version%.*},$IMAGE:latest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "version=$version tags=$tags"

      - name: set up buildx
        run: |
          docker buildx version
          docker buildx create --name sigillum --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: log in to ghcr.io
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Installed on PRs too so a bad version/checksum pin fails early.
      - uses: ./.github/actions/setup-cosign

      - name: build (and push on tags)
        id: build
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
          CREATED: ${{ steps.meta.outputs.created }}
        run: |
          args=(--platform "$PLATFORMS"
                --build-arg "VERSION=$VERSION"
                --build-arg "COMMIT=$GITHUB_SHA"
                --build-arg "DATE=$CREATED"
                --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
                --label "org.opencontainers.image.revision=$GITHUB_SHA"
                --label "org.opencontainers.image.version=$VERSION"
                --label "org.opencontainers.image.created=$CREATED"
                --provenance=mode=max
                --sbom=true
                --metadata-file "$RUNNER_TEMP/build-metadata.json")
          IFS=, read -ra tag_list <<< "$TAGS"
          for t in "${tag_list[@]}"; do args+=(--tag "$t"); done
          if [ "$PUBLISH" = true ]; then args+=(--push); fi
          docker buildx build "${args[@]}" .
          if [ "$PUBLISH" = true ]; then
            digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build-metadata.json")
            if [[ "$digest" != sha256:* ]]; then
              echo "no image digest in build metadata: $digest"
              exit 1
            fi
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "pushed $IMAGE@$digest"
          fi

      # Signs the multi-arch index by digest; tags are just pointers to it.
      - name: sign image
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: attest image provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Storage records are only supported for organization-owned repos.
          create-storage-record: false

      - name: export SBOMs
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p sbom
          IFS=, read -ra platforms <<< "$PLATFORMS"
          for p in "${platforms[@]}"; do
            out="sbom/sigillum-${p//\//-}.spdx.json"
            docker buildx imagetools inspect "$IMAGE@$DIGEST" \
              --format "{{ json (index .SBOM \"$p\").SPDX }}" > "$out"
            jq -e '.spdxVersion' "$out" >/dev/null
          done
          ls -l sbom

      - name: upload SBOMs
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ steps.meta.outputs.version }}
          path: sbom/
          if-no-files-found: error

  chart:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      packages: write
      id-token: write      # Sigstore signing certificate (cosign, attest)
      attestations: write  # store the provenance attestation in GitHub
    env:
      CHART: ghcr.io/${{ github.repository_owner }}/charts/sigillum
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-cosign

      - name: extract version
        id: v
        run: |
          if [ "$PUBLISH" = true ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(awk '/^version:/ {print $2}' charts/sigillum/Chart.yaml)" >> "$GITHUB_OUTPUT"
          fi

      - name: sanity-check chart version
        if: env.PUBLISH == 'true'
        env:
          WANT: ${{ steps.v.outputs.version }}
        run: |
          got=$(awk '/^version:/ {print $2}' charts/sigillum/Chart.yaml)
          if [ "$got" != "$WANT" ]; then
            echo "chart version $got != tag version $WANT"
            exit 1
          fi

      - name: lint and package chart
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          helm version
          helm lint charts/sigillum
          helm package charts/sigillum --version "$VERSION" --app-version "$VERSION"

      - name: push chart to OCI registry
        id: push
        if: env.PUBLISH == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # cosign and actions/attest read registry credentials from Docker's config.
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "sigillum-$VERSION.tgz" "oci://${CHART%/*}" 2>&1 | tee "$RUNNER_TEMP/helm-push.log"
          digest=$(awk '/^Digest:/ {print $2}' "$RUNNER_TEMP/helm-push.log")
          if [[ "$digest" != sha256:* ]]; then
            echo "no chart digest in helm push output"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: sign chart
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$CHART@$DIGEST"

      - name: attest chart provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.CHART }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
