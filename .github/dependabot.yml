# Dependabot keeps Go modules, GitHub Actions (pinned to commit SHAs), the
# zizmor workflow linter and the digest-pinned Docker base images current.
#
# Version updates wait out a cooldown so a freshly published (and possibly
# compromised or quickly yanked) release is not pulled in on day one.
# Security updates are not subject to the cooldown and open immediately.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(go)"
    groups:
      # client-go, controller-runtime and friends must move together.
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
      golang-x:
        patterns:
          - "golang.org/x/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        patterns:
          - "*"

  # zizmor for the lint-actions workflow (hash-pinned requirements file).
  - package-ecosystem: pip
    directory: /.github/zizmor
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(actions)"

  # Covers Dockerfile and Dockerfile.ci.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(docker)"
    groups:
      base-images:
        patterns:
          - "*"
